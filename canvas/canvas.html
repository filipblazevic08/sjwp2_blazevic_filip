<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
</head>
<body>
    <canvas id="myCanvas" width="600" height="600" style="border: 1px solid black"></canvas>
    <script>
        let c=document.getElementById("myCanvas");
        let ctx=c.getContext("2d");

        //cetverokut
        ctx.beginPath();
        ctx.rect(100, 100, 200, 100);
        ctx.fillStyle="blue";
        ctx.fill();

        //krug
        //ctx.beginPath();
        //ctx.arc(200, 300, 80, 0, 2 * Math.PI);
        //ctx.stroke();

        //trokut
        ctx.beginPath();
        CTX.moveTo(50, 50);
        ctx.lineTo(400, 350);
        ctx.lineTo(200, 350);
        ctx.lineTo(300, 250);
        ctx.fillStyle="red";

        
    </script>
</body>
</html>
